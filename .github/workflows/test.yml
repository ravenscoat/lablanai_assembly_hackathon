name: test

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  # Reusable: deploy.yml calls this so deploys can't ship broken code.
  workflow_call: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: >-
          ruff check src/relaydesk src/assemblyai_voice
          scripts/run_voice_evaluation.py
          tests/unit/test_relaydesk_store.py
          tests/unit/test_relaydesk_store_factory.py
          tests/unit/test_relaydesk_semantic_memory.py
          tests/unit/test_relaydesk_runtime_events.py
          tests/unit/test_voice_evaluation.py
          tests/unit/test_assemblyai_session_config.py

      - name: Black
        run: >-
          black --check src/relaydesk src/assemblyai_voice
          scripts/run_voice_evaluation.py
          tests/unit/test_relaydesk_store.py
          tests/unit/test_relaydesk_store_factory.py
          tests/unit/test_relaydesk_semantic_memory.py
          tests/unit/test_relaydesk_runtime_events.py
          tests/unit/test_voice_evaluation.py
          tests/unit/test_assemblyai_session_config.py

      - name: Pytest
        run: >-
          pytest -v
          tests/unit/test_relaydesk_store.py
          tests/unit/test_relaydesk_store_factory.py
          tests/unit/test_relaydesk_semantic_memory.py
          tests/unit/test_relaydesk_runtime_events.py
          tests/unit/test_voice_evaluation.py
          tests/unit/test_assemblyai_session_config.py
