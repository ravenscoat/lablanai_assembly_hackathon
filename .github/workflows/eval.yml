name: eval

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relaydesk-eval:
    name: RelayDesk Offline Behavioral Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run memory, orchestration, safety, and voice-contract evaluations
        run: |
          pytest -v \
            tests/unit/test_relaydesk_store.py \
            tests/unit/test_relaydesk_semantic_memory.py \
            tests/unit/test_relaydesk_runtime_events.py \
            tests/unit/test_voice_evaluation.py

      - name: Publish verified real-audio evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: relaydesk-real-audio-evaluation-report
          path: docs/VOICE_EVALUATION_RESULTS.md
          retention-days: 30
