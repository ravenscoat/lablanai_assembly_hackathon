services:
  agent:
    # On servers: IMAGE_TAG is set via env (staging|prod) so `docker compose pull`
    # fetches the correct image from GHCR. Locally, `docker compose build` still
    # works because of the build block below.
    image: ghcr.io/${GHCR_OWNER:-your-org}/urdu-voice-agent:${IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      HEALTH_PORT: 8082
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-dev}
    ports:
      - "8082:8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - voice_agent

  agent-monitor:
    image: ghcr.io/${GHCR_OWNER:-your-org}/urdu-voice-agent:${IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-agent-monitor
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "scripts/agent_monitor.py", "loop"]
    environment:
      QDRANT_URL: http://qdrant:6333
      MONITOR_HEALTH_URL: http://agent:8082/health
      MONITOR_STATE_PATH: /state/agent-monitor-state.json
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-3600}
      MONITOR_INITIAL_DELAY_SECONDS: ${MONITOR_INITIAL_DELAY_SECONDS:-30}
      MONITOR_NOTIFY_MODE: ${MONITOR_NOTIFY_MODE:-failures_only}
      MONITOR_FIRST_SUCCESS_HOURS: ${MONITOR_FIRST_SUCCESS_HOURS:-24}
      MONITOR_TELEGRAM_BOT_TOKEN: ${MONITOR_TELEGRAM_BOT_TOKEN:-}
      MONITOR_TELEGRAM_CHAT_ID: ${MONITOR_TELEGRAM_CHAT_ID:-}
      MONITOR_TELEGRAM_THREAD_ID: ${MONITOR_TELEGRAM_THREAD_ID:-}
      MONITOR_CALLED_PHONE: ${MONITOR_CALLED_PHONE:-}
    volumes:
      - monitor_state:/state
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - voice_agent

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-agent-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - voice_agent

volumes:
  qdrant_data:
  monitor_state:

networks:
  voice_agent:
    driver: bridge
