[project]
name = "urdu-voice-agent"
version = "0.1.0"
description = "Multi-tenant voice AI agent building block (LiveKit)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "urdu-voice-agent maintainers"}
]
keywords = ["voice-agent", "livekit", "multi-tenant", "agentic", "stt", "tts"]

dependencies = [
    "livekit>=1.0.23",
    "livekit-api>=1.1.0",
    "livekit-agents>=1.3.12",
    "livekit-plugins-google>=1.3.12",
    "livekit-plugins-silero>=1.3.12",
    "livekit-plugins-openai>=1.3.12",
    "livekit-plugins-noise-cancellation>=0.2.5",
    # Urdu speech engines wired through the urdu_stt/urdu_tts seams.
    "livekit-plugins-speechmatics>=1.3.12",
    "livekit-plugins-azure>=1.3.12",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "tzdata>=2025.2",
    "prometheus-client>=0.24.0",
    "langfuse>=3.0.0",
    "opentelemetry-sdk>=1.28.0",
    "aiohttp>=3.9.0",
    "websockets>=15.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    # RAG
    "qdrant-client>=1.7.0",
    "google-generativeai>=0.8.0",
    "google-genai>=1.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
relaydesk-assemblyai = "assemblyai_voice.bridge:main"
relaydesk-dashboard = "relaydesk.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
